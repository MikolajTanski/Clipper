<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#001a0f"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="900" height="280" rx="12" fill="url(#bg)"/>
  <text x="450" y="32" text-anchor="middle" fill="#e5fef4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Ktora sciezka?</text>

  <rect x="40" y="60" width="240" height="180" rx="12" fill="#14532d" stroke="#00ff88" stroke-width="2"/>
  <text x="160" y="95" text-anchor="middle" fill="#00ff88" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">A. Docker</text>
  <text x="160" y="118" text-anchor="middle" fill="#e5fef4" font-family="Arial, Helvetica, sans-serif" font-size="11">Przegladarka + UI</text>
  <text x="160" y="140" text-anchor="middle" fill="#9ca3af" font-family="Arial, Helvetica, sans-serif" font-size="10">~10 min, polecane</text>
  <text x="160" y="165" text-anchor="middle" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="10">docker compose up</text>
  <text x="160" y="182" text-anchor="middle" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="10">localhost:8080</text>
  <text x="160" y="215" text-anchor="middle" fill="#00ff88" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600">90% przypadkow</text>

  <rect x="330" y="60" width="240" height="180" rx="12" fill="#0a1f14" stroke="#374151" stroke-width="1.5"/>
  <text x="450" y="95" text-anchor="middle" fill="#9ca3af" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">B. CLI</text>
  <text x="450" y="118" text-anchor="middle" fill="#e5fef4" font-family="Arial, Helvetica, sans-serif" font-size="11">Tylko terminal</text>
  <text x="450" y="140" text-anchor="middle" fill="#9ca3af" font-family="Arial, Helvetica, sans-serif" font-size="10">~3 min, szybko</text>
  <text x="450" y="165" text-anchor="middle" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="10">python merge.py ...</text>
  <text x="450" y="182" text-anchor="middle" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="10">bez Docker, bez UI</text>

  <rect x="620" y="60" width="240" height="180" rx="12" fill="#0a1f14" stroke="#374151" stroke-width="1.5"/>
  <text x="740" y="95" text-anchor="middle" fill="#9ca3af" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">C. Dev</text>
  <text x="740" y="118" text-anchor="middle" fill="#e5fef4" font-family="Arial, Helvetica, sans-serif" font-size="11">Edycja kodu</text>
  <text x="740" y="140" text-anchor="middle" fill="#9ca3af" font-family="Arial, Helvetica, sans-serif" font-size="10">2 terminale</text>
  <text x="740" y="165" text-anchor="middle" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="10">python web.py + npm run dev</text>
  <text x="740" y="182" text-anchor="middle" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="10">localhost:5173</text>
</svg>
