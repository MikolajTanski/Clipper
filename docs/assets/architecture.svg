<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#001a0f"/>
      <stop offset="0.5" stop-color="#000000"/>
      <stop offset="1" stop-color="#000d08"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00ff88"/>
      <stop offset="1" stop-color="#00a060"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="920" height="420" rx="16" fill="url(#bg)"/>
  <text x="460" y="36" text-anchor="middle" fill="#e5fef4" font-family="system-ui,sans-serif" font-size="18" font-weight="600">Spinacz  architektura</text>

  <!-- Browser -->
  <rect x="40" y="70" width="200" height="120" rx="10" fill="#0a1f14" stroke="#00ff88" stroke-width="1.5" filter="url(#glow)"/>
  <text x="140" y="98" text-anchor="middle" fill="#00ff88" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Przegldarka</text>
  <text x="140" y="118" text-anchor="middle" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="11">React SPA</text>
  <text x="140" y="136" text-anchor="middle" fill="#6b7280" font-family="system-ui,sans-serif" font-size="10">drag &amp; drop · podgld</text>
  <text x="140" y="154" text-anchor="middle" fill="#6b7280" font-family="system-ui,sans-serif" font-size="10">:8080</text>

  <!-- Arrow 1 -->
  <path d="M250 130 H310" stroke="#00ff88" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="120" text-anchor="middle" fill="#6b7280" font-family="system-ui,sans-serif" font-size="9">POST /api/merge</text>

  <!-- Nginx -->
  <rect x="320" y="70" width="200" height="120" rx="10" fill="#0a1f14" stroke="#00c878" stroke-width="1.5"/>
  <text x="420" y="98" text-anchor="middle" fill="#00c878" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Nginx</text>
  <text x="420" y="118" text-anchor="middle" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="11">statyczny front + proxy</text>
  <text x="420" y="136" text-anchor="middle" fill="#6b7280" font-family="system-ui,sans-serif" font-size="10">max 500 MB · timeout 300s</text>
  <text x="420" y="154" text-anchor="middle" fill="#6b7280" font-family="system-ui,sans-serif" font-size="10">kontener frontend</text>

  <!-- Arrow 2 -->
  <path d="M530 130 H590" stroke="#00ff88" stroke-width="2"/>

  <!-- Flask -->
  <rect x="600" y="70" width="200" height="120" rx="10" fill="#0a1f14" stroke="#00a060" stroke-width="1.5"/>
  <text x="700" y="98" text-anchor="middle" fill="#00a060" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Flask API</text>
  <text x="700" y="118" text-anchor="middle" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="11">POST /api/merge</text>
  <text x="700" y="136" text-anchor="middle" fill="#6b7280" font-family="system-ui,sans-serif" font-size="10">multipart upload</text>
  <text x="700" y="154" text-anchor="middle" fill="#6b7280" font-family="system-ui,sans-serif" font-size="10">:5050 (host)</text>

  <!-- Arrow down -->
  <path d="M700 200 V250" stroke="#00ff88" stroke-width="2"/>

  <!-- Core -->
  <rect x="580" y="260" width="240" height="80" rx="10" fill="#0a1f14" stroke="url(#green)" stroke-width="2" filter="url(#glow)"/>
  <text x="700" y="290" text-anchor="middle" fill="#00ff88" font-family="system-ui,sans-serif" font-size="13" font-weight="600">core.py  merge_pdfs()</text>
  <text x="700" y="312" text-anchor="middle" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="11">pypdf · PdfReader / PdfWriter</text>

  <!-- CLI branch -->
  <path d="M580 300 H120" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="40" y="260" width="200" height="80" rx="10" fill="#0a1f14" stroke="#374151" stroke-width="1.5"/>
  <text x="140" y="290" text-anchor="middle" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="13" font-weight="600">CLI (Typer)</text>
  <text x="140" y="312" text-anchor="middle" fill="#6b7280" font-family="system-ui,sans-serif" font-size="11">merge.py · ten sam core</text>

  <!-- Output -->
  <rect x="340" y="360" width="240" height="44" rx="8" fill="#14532d" stroke="#00ff88" stroke-width="1"/>
  <text x="460" y="388" text-anchor="middle" fill="#e5fef4" font-family="system-ui,sans-serif" font-size="12" font-weight="600">spinacz.pdf</text>
  <path d="M700 340 C700 360 580 360 580 382" stroke="#00ff88" stroke-width="1.5" fill="none"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00ff88"/>
    </marker>
  </defs>
</svg>
